name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          pip install ruff black

      - name: Run ruff
        run: ruff check .

      - name: Check formatting with black
        run: black --check .

  test-client:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install client dependencies
        run: |
          pip install pytest pytest-asyncio httpx pydantic

      - name: Install client package
        run: |
          pip install -e packages/blpremote_client

      - name: Run client tests
        run: |
          pytest packages/blpremote_client/tests -v

  test-server:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install server dependencies
        run: |
          pip install pytest pytest-asyncio fastapi pydantic pydantic-settings python-jose bcrypt httpx

      - name: Install server package
        run: |
          pip install -e packages/blpremote_server

      - name: Run server tests
        run: |
          pytest packages/blpremote_server/tests -v

  integration:
    runs-on: ubuntu-latest
    needs: [test-client, test-server]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install all dependencies
        run: |
          pip install pytest pytest-asyncio httpx fastapi uvicorn pydantic pydantic-settings python-jose bcrypt

      - name: Install packages
        run: |
          pip install -e packages/blpremote_client
          pip install -e packages/blpremote_server

      - name: Run integration tests (mock mode)
        run: |
          # Start server in background
          python -m uvicorn blpremote_server.app:app --host 0.0.0.0 --port 8000 &
          sleep 5
          
          # Test health endpoint
          curl -f http://localhost:8000/health
          
          # Test version endpoint
          curl -f http://localhost:8000/version
