[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blpapi-remote-wrapper"
version = "0.1.0"
description = "Remote Bloomberg BLPAPI Wrapper - macOS authoring, Windows execution"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Krishna Dattani" }
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "black>=23.0",
    "httpx>=0.25",
    "pytest-httpx>=0.21",
]

# Client package (macOS)
[tool.hatch.envs.client]
dependencies = [
    "httpx>=0.25",
    "pydantic>=2.0",
]

# Server package (Windows)
[tool.hatch.envs.server]
dependencies = [
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["packages/blpremote_client/tests", "packages/blpremote_server/tests"]
asyncio_mode = "auto"
