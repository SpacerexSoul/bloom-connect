[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blpremote-client"
version = "0.1.0"
description = "macOS client for remote Bloomberg BLPAPI execution"
readme = "../../README.md"
license = "MIT"
authors = [
    { name = "Krishna Dattani" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25",
    "pydantic>=2.0",
]

[project.optional-dependencies]
pandas = ["pandas>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-httpx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/blpremote_client"]
